# 恶魔轮盘联机后端反代：把 wss://api.cloudery.cn/toy-mp 转到本机 Node（127.0.0.1:8091）
#
# 2026-11-06 实测定稿版（国内源站 180.97.215.247 已按此配置跑通，公网握手 101）。
#
# 用法二选一：
#   A. 1Panel 站点 → 网站设置 → 配置文件，把下面两条 location 贴进 api.cloudery.cn 的
#      server 块；或更省事：写成 /www/1panel/www/sites/api.cloudery.cn/proxy/toy-mp.conf，
#      由 server 块里的 `include .../proxy/*.conf;` 自动加载，然后 reload 即可。
#   B. 独立子域（如 game.cloudery.cn）：整份 server 块直接用。
#
# 三条必须项，缺一条握手就 400/426：
#   1. proxy_http_version 1.1      —— HTTP/1.0 不支持协议切换
#   2. Upgrade / Connection 透传   —— 让 Nginx 把 101 Switching Protocols 交还给客户端
#   3. proxy_read_timeout 大于空闲时间 —— 默认 60s 会在房间里干等时掐断（Node 侧 30s ping）
#
# 四条踩过的坑：
#   - **两条 location 都要有**：前端 wsUrl 末尾不带斜杠，握手只打精确路径 /toy-mp；
#     页面内 css/js 走 /toy-mp/xxx。只配 `location /toy-mp` 且 proxy_pass 不带斜杠，
#     Node 会收到带前缀的路径而返回 404。
#   - proxy_pass 末尾的 **斜杠不能少**：它把 /toy-mp/xxx 改写成 /xxx，正好对上 Node 的根目录。
#   - 站点若还有 `location ^~ / { proxy_pass ...8080; }`（ClouderyApi），新加的两条
#     前缀更长，会优先命中，不需要调整顺序。
#   - EdgeOne 回源带的 Host 是 HostHeader（当前借道 baidu.com），**不会**命中
#     server_name api.cloudery.cn；8443 上只有这一个 ssl server 块，所以照样落到这里。
#     443 上有 `ssl_reject_handshake on` 的 default_server，SNI 对不上会直接拒绝握手。
#
# 若前面还挂了 CDN（当前 api.cloudery.cn → EdgeOne）：CDN 侧要打开 WebSocket 开关并
# 放行 Upgrade 头，否则源站配得再对，公网握手也会失败。

location = /toy-mp {
    proxy_pass http://127.0.0.1:8091/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}

location ^~ /toy-mp/ {
    proxy_pass http://127.0.0.1:8091/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}


# 联机后端反代：把 wss://api.cloudery.cn/toy-mp 转到本机 Node（127.0.0.1:8080）
#
# 用法二选一：
#   A. 1Panel 面板「网站 → api.cloudery.cn → 配置文件」，把下面 location 贴进对应的
#      server { } 块里（注意要放在已有的 location /toy/ 之前或之后都行，前缀不冲突：
#      /toy-mp 与 /toy/ 是两条不同前缀）。
#   B. 独立子域（如 game.cloudery.cn）：整份 server 块直接用。
#
# 三个必须项，缺一条握手就 400/426：
#   1. proxy_http_version 1.1      —— HTTP/1.0 不支持协议切换
#   2. Upgrade / Connection 透传   —— 让 Nginx 把 101 Switching Protocols 交还给客户端
#   3. proxy_read_timeout 大于空闲时间 —— 默认 60s 会在房间里干等时掐断连接
#
# 若 api.cloudery.cn 前面还挂了 CDN（当前解析到多个 IP，说明有），CDN 侧要打开
# WebSocket 开关并放行 Upgrade 头，否则源站配置再对，公网握手也会失败。

location /toy-mp {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Node 侧每 30 秒 ping 一次，这里留足余量；小于 35s 会把玩家从大厅踢掉。
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_buffering off;
}


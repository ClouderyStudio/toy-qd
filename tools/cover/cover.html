<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>cover</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="out" width="1920" height="1080"></canvas>
<script src="../../js/gfx.js"></script>
<script src="../../js/sprites.js"></script>
<script src="../../js/bg.js"></script>
<script src="../../js/draw-dealer.js"></script>
<script src="../../js/draw-table.js"></script>
<script>
/* 宣传封面（手机友好版）
 * 场景按游戏原生 320x180 绘制，只裁中间 160x90（庄家特写）放大 12 倍。
 * 安全区：B站首页 4:3 裁切保留 x 240~1680；手机卡片底部约 20% 被播放量条遮挡。 */
const BR = window.BR, g = BR.gfx, D = BR.draw, c = g.c, W = 320, H = 180;
const CROP = { x: 80, y: 8, w: 160, h: 90 };
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const th = (x, y) => BAYER[(y & 3) * 4 + (x & 3)] / 16;
function dither(col, f, y0 = 0, y1 = H) {
  c.fillStyle = col;
  for (let y = y0; y < y1; y++) for (let x = 0; x < W; x++) if (f(x, y) > th(x, y)) c.fillRect(x, y, 1, 1);
}
const glow = (x, y, cx, cy, r) => Math.max(0, 1 - Math.hypot(x - cx, (y - cy) * 1.3) / r);

// 墙面 + 庄家身后的红光
BR.bg('table');
dither('#3a0a0e', (x, y) => glow(x, y, 160, 34, 80) * 0.9, 0, 108);
dither('#6a1018', (x, y) => glow(x, y, 160, 34, 45) * 0.6, 0, 108);
const bgCv = document.createElement('canvas'); bgCv.width = W; bgCv.height = H;
bgCv.getContext('2d').drawImage(g.lo, 0, 0);

// 两侧对手（16:9 可见，4:3 下只露半身）+ 庄家特写
D.player(100, 50, 0, 1, {});
D.player(220, 50, 0, 2, {});
const T = 1.745;
D.dealer(160, 34, T, { lean: 0.01 });
const ey = 34 + Math.round(Math.sin(T * 1.6)), look = Math.round(Math.sin(T * 0.7));
[-6, 6].forEach((s) => { g.px(160 + s + look, ey - 5, '#ff3030'); g.px(160 + s + look - 1, ey - 5, '#801010'); });

// 桌沿（把原桌面上移到画面底部）+ 枯手
c.drawImage(bgCv, 0, 108, W, 72, 0, 90, W, 72);
g.rect(0, 89, 320, 1, '#0a0a08');
D.dealerHands(160, 91, T);

// 暗角 + 标题区压暗
dither('#000', (x, y) => Math.max(0, Math.hypot((x - 160) / 80, (y - 50) / 50) - 0.85) * 1.6);
dither('#000', (x, y) => Math.max(0, (y - 84) / 14), 84, 98);

const out = document.getElementById('out'), o = out.getContext('2d');
o.imageSmoothingEnabled = false;
o.drawImage(g.lo, CROP.x, CROP.y, CROP.w, CROP.h, 0, 0, 1920, 1080);
</script>
<script src="cover-title.js"></script>
</body></html>
